<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Aroma & Grão — Gestão da Cafeteria</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <div class="container">
            <h1>Café Aroma & Grão</h1>
            <p>Sistema Integrado de Pedidos, Cardápio e Salão</p>
        </div>
    </header>

    <nav class="tabs container" aria-label="Entidades do sistema">
        <button class="tab-btn active" data-entity="pedidos">Pedidos</button>
        <button class="tab-btn" data-entity="produtos">Produtos</button>
        <button class="tab-btn" data-entity="categorias">Categorias</button>
        <button class="tab-btn" data-entity="clientes">Clientes</button>
        <button class="tab-btn" data-entity="mesas">Mesas</button>
    </nav>

    <main class="container">
        <div id="feedback-box" class="feedback hidden" role="alert"></div>

        <div class="grid-layout">
            <section class="card">
                <div class="card-header">
                    <h2 id="form-title">Novo Registro</h2>
                    <button type="button" id="btn-cancel-edit" class="btn-secondary hidden">Cancelar Edição</button>
                </div>
                <form id="entity-form" novalidate></form>
            </section>

            <section class="card">
                <div class="card-header">
                    <h2 id="list-title">Registros Cadastrados</h2>
                    <div class="search-group">
                        <label for="search-id" class="sr-only">Consultar por ID</label>
                        <input type="number" id="search-id" min="1" placeholder="Buscar ID...">
                        <button type="button" id="btn-search" class="btn-secondary">Consultar</button>
                        <button type="button" id="btn-reset-search" class="btn-secondary">Todos</button>
                    </div>
                </div>

                <div id="loading-state" class="state-box hidden">Carregando dados da API...</div>
                <div id="empty-state" class="state-box hidden">Nenhum registro encontrado.</div>

                <div class="table-wrapper">
                    <table>
                        <thead id="table-head"></thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
